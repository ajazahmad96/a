<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050403"><title>AJAZ MYSTIC PORTAL</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><canvas id="c"></canvas>
<header><h1>AJAZ MYSTIC PORTAL</h1><p>MASTER OF THE MYSTIC ARTS</p><small id="dest">DESTINATION: ASGARD</small></header>
<div id="hint">DRAW A CIRCLE</div><div id="msg"></div><div id="conf"><i></i><span>HAND</span></div>
<video id="cam" playsinline muted></video><svg id="prog" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16"/></svg>
<nav><button id="bMode">TOUCH</button><button id="bSnd">SOUND OFF</button><button id="bReset">RESET</button><button id="bClose">CLOSE</button><button id="bFs">FULL</button><button id="bSet">⚙</button></nav>
<section id="panel" hidden>
<label>Destination<select id="sDest"><option value="0">Asgard</option><option value="1">Mirror Dimension</option></select></label>
<label>Size<input id="sSize" type="range" min=".5" max="1.3" step=".01" value="1"></label>
<label>Rotation<input id="sRot" type="range" min="-3.14" max="3.14" step=".01" value="0"></label>
<label>Gesture sensitivity<input id="sSens" type="range" min="0" max="1" step=".01" value=".6"></label>
<label>Volume<input id="sVol" type="range" min="0" max="1" step=".01" value=".6"></label></section>
<script type="module" src="js/main.js"></script></body></html>
